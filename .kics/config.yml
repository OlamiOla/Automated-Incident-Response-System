path:
  - modules/

exclude-queries:
  - "7ebc9038-0bde-479a-acc4-6ed7b6758899"  # KMS root-admin policy uses kms:*
  - "482b7d26-0bdb-4b5f-bf6f-545826c0a3dd"  # CloudTrail SNS topic undefined
  - "c5b31ab9-0f26-4a49-b8aa-4cc064392f4d"  # S3 MFA Delete — not settable via Terraform
  - "e592a0c5-5bdb-414c-9066-5dba7cdea370"  # IAM Access Analyzer — already created once in kms module
  - "e39f87f5-0abf-488b-864c-63ee1f588140"  # S3 bucket notifications — deliberately not wired, see suppressions.md
  - "4bc4dd4c-7d8d-405e-a0fb-57fa4c31b4d9"  # S3 Bucket Policy Accepts HTTP Requests — false positive, see suppressions.md
  - "f861041c-8c9f-4156-acfc-5e6e524f5884"  # S3 Bucket Logging Disabled — access_logs is a logging target itself, self-logging would loop

exclude-severities:
  - info

fail-on:
  - high
  - medium

report-formats:
  - json

output-path: kics-report
