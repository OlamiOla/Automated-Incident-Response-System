name: Terragrunt Plan

# This workflow runs without real AWS credentials.
# Dummy credentials are injected so the AWS provider can initialise and
# parse configuration, but no real AWS API calls are made.
# -backend=false skips the S3 remote state backend entirely.
# TG_SKIP_DEPENDENCY_OUTPUTS=true uses mock dependency outputs instead of
# reading real state, so cross-module dependencies resolve without a live account.
#
# This gives you: syntax validation, provider schema checks, and a plan
# that catches most configuration errors — all without AWS access.
#
# Limitations: data sources that call AWS APIs (e.g. aws_caller_identity,
# aws_region) will return errors or empty values in the plan output. This is
# expected and does not indicate a real problem with the infrastructure code.

on:
  push:
    branches:
     - main
     - airsys

  pull_request:
    branches: [main]

  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.5"
  TERRAGRUNT_VERSION: "1.1.6"

jobs:
  kics-scan:
    name: KICS Scan
    uses: ./.github/workflows/kics-scan.yml
    with:
      scan-path: '.'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  plan:
    name: Plan (dev — no AWS)
    runs-on: ubuntu-latest
    needs: kics-scan
    defaults:
      run:
        working-directory: live/dev

    env:
      # Dummy credentials — allow the AWS provider to initialise without
      # making real API calls. No real account is accessed.
      AWS_ACCESS_KEY_ID: "mock-access-key-id"
      AWS_SECRET_ACCESS_KEY: "mock-secret-access-key"
      AWS_DEFAULT_REGION: "us-east-1"
      # Use mock dependency outputs — no real state reads attempted.
      TG_SKIP_DEPENDENCY_OUTPUTS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -fsSLo terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
          terragrunt --version

      - name: Terragrunt Init (no backend)
        run: |
          terragrunt run --all \
            --non-interactive \
            --terragrunt-parallelism 1 \
            -- init -backend=false

      - name: Terragrunt Plan (no backend)
        run: |
          set -o pipefail
          terragrunt run --all \
            --non-interactive \
            --terragrunt-parallelism 1 \
            -- plan -lock=false -input=false 2>&1 | tee plan_output.txt

      - name: Upload plan output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragrunt-plan-output
          path: live/dev/plan_output.txt
          retention-days: 30
          if-no-files-found: warn
