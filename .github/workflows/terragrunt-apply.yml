name: Terragrunt Apply

# The CI plan job runs without real AWS credentials (same as terragrunt-plan.yml)
# and validates configuration on every push/PR.
#
# The apply job is intentionally disabled in CI — it requires a real AWS account,
# valid OIDC credentials, and a configured S3 backend. To deploy:
#   1. Configure AWS OIDC as described in the README (Troubleshooting → OIDC).
#   2. Set the AWS_ROLE_ARN and AWS_REGION repository variables in GitHub.
#   3. Re-enable the apply job by removing the `if: false` condition below.

on:
  push:
    branches:
      - main
      - airsys

  pull_request:
    branches: [main]

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

env:
  TERRAGRUNT_VERSION: "1.1.6"
  TERRAFORM_VERSION: "1.16.5"

jobs:
  kics-scan:
    name: KICS Scan
    uses: ./.github/workflows/kics-scan.yml
    with:
      scan-path: '.'
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write

  plan:
    name: Plan (prod — no AWS)
    runs-on: ubuntu-latest
    needs: kics-scan
    defaults:
      run:
        working-directory: live/prod

    env:
      AWS_ACCESS_KEY_ID: "mock-access-key-id"
      AWS_SECRET_ACCESS_KEY: "mock-secret-access-key"
      AWS_DEFAULT_REGION: "us-east-1"
      TG_SKIP_DEPENDENCY_OUTPUTS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -fsSLo terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
          terragrunt --version

      - name: Terragrunt Init (no backend)
        run: |
          terragrunt run --all \
            --non-interactive \
            --terragrunt-parallelism 1 \
            -- init -backend=false

      - name: Terragrunt Plan (no backend)
        run: |
          set -o pipefail
          terragrunt run --all \
            --non-interactive \
            --terragrunt-parallelism 1 \
            -- plan -lock=false -input=false 2>&1 | tee plan_output.txt

      - name: Upload plan output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragrunt-apply-plan-output
          path: live/prod/plan_output.txt
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # APPLY — disabled until AWS OIDC is configured.
  # To enable: remove `if: false`, set AWS_ROLE_ARN and AWS_REGION in GitHub
  # repository variables, and configure the OIDC trust policy per the README.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply (prod)
    runs-on: ubuntu-latest
    if: false  # Remove this line once OIDC is configured
    needs: [kics-scan, plan]
    environment: production
    defaults:
      run:
        working-directory: live/prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -fsSLo terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terragrunt Init
        run: |
          terragrunt run --all \
            --non-interactive \
            --terragrunt-parallelism 1 \
            -- init

      - name: Terragrunt Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          terragrunt run --all \
            --non-interactive \
            --terragrunt-parallelism 1 \
            -- apply -auto-approve

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        with:
          payload: |
            {
              "text": "Terragrunt apply to prod: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
